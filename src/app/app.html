<app-sidebar />

<main class="w-full" id="main" >
  <header class="p-2 sm:ml-44" id="header">
    <app-header class="flex justify-between content-center gap-6"/>
  </header>

  <article class="p-2 sm:ml-44 min-h-(--screenH)" id="content" [class.blur-2xl]="sharedService.blurBackgroundApp()">
    <aside class="relative mx-4 mt-4 rounded-2xl bg-destructive px-4 py-3 text-destructive-foreground" role="status">
      <div class="flex items-start gap-3">
        <span aria-hidden="true" class="material-symbols-outlined shrink-0">warning</span>
        <div>
          <h2 class="m-0 p-0 font-title text-base font-bold">Arrêt prochain de Smart'Flore</h2>
          <p class="m-0 mt-1 text-sm leading-relaxed">
            Les saisies seront arrêtées le <strong>1er octobre 2026</strong> : les données enregistrées après cette date ne seront pas sauvegardées.
            L'application fermera complètement le <strong>31 octobre 2026</strong>.

            <a class="font-semibold underline decoration-2 underline-offset-2 hover:no-underline"
               href="https://www.tela-botanica.org/2026/09/tela-botanica-evolue-ce-qui-change-a-partir-de-lautomne-2026/"
               rel="noopener noreferrer"
               target="_blank"
            >
              En savoir plus
              <span class="sr-only">(nouvelle fenêtre)</span>
            </a>
          </p>
        </div>
      </div>
    </aside>

    <router-outlet />
  </article>

  <button
    aria-label="Remonter en haut de la page"
    class="fixed bottom-5 right-5 z-50  text-white hover:text-primary p-2 rounded-full shadow-lg transition-opacity duration-300 text-2xl hover:no-underline "
    title="Remonter en haut"
    type="button"
    [class.opacity-0]="!showUpIcon"
    [class.pointer-events-none]="!showUpIcon"
    (click)="scrollToTop()"
  >
    ↑
  </button>

  @defer (on immediate){
    <footer class="p-2 sm:ml-44" id="footer">
      <app-footer class="flex justify-between content-center gap-6"/>
    </footer>
  }

</main>
